{% extends "base.html" %}

{% block content %}
<div class="container py-5 animate__animated animate__fadeIn">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-primary p-4 text-center position-relative">
                    <div class="avatar-circle bg-white text-primary mx-auto mb-3 shadow" style="width: 80px; height: 80px; font-size: 2rem;">
                        <i class="fas fa-user-edit"></i>
                    </div>
                    <h3 class="text-white fw-bold mb-0">Mon Profil</h3>
                    <p class="text-white-50 mb-0">{{ session.user_role|capitalize }}</p>
                </div>
                
                <div class="card-body p-4">
                    {% if is_admin %}
                    <form action="{{ url_for('profile.update_profil') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">PRENOM</label>
                            <input type="text" name="prenom" class="form-control" value="{{ user.prenom or '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">NOM</label>
                            <input type="text" name="nom" class="form-control" value="{{ user.nom or '' }}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">EMAIL DE CONNEXION</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email or '' }}" required>
                        </div>

                        <hr class="my-4">

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-pro py-3 shadow">
                                <i class="fas fa-save me-2"></i>Enregistrer les modifications
                            </button>
                        </div>
                    </form>
                    {% else %}
                    <form action="{{ url_for('profile.update_profil') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">PRENOM</label>
                            <input type="text" name="prenom" class="form-control" value="{{ user.prenom or '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">NOM</label>
                            <input type="text" name="nom" class="form-control" value="{{ user.nom or '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">EMAIL DE CONNEXION</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email or '' }}" placeholder="nom@santescolaire.ma" required>
                            <div class="form-text">Cet email est utilisé pour vous connecter à l'application.</div>
                        </div>

                        {% if session.user_role == 'medecin' %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">SPÉCIALITÉ</label>
                            <input type="text" name="specialite" class="form-control" value="{{ user.specialite or '' }}">
                        </div>
                        {% endif %}

                        <hr class="my-4">

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-pro py-3 shadow">
                                <i class="fas fa-save me-2"></i>Enregistrer les modifications
                            </button>
                        </div>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
